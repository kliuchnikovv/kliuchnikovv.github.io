<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="decker — a pocket ESP32-S3 cyberdeck with a terminal screen and keyboard, SSH-tunnelled over WiFi to a remote machine">
  <defs>
    <radialGradient id="de-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F3DFB0" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#F3DFB0" stop-opacity="0"/>
    </radialGradient>
    <style>
      .ink{stroke:#26251F;} .mut{stroke:#C9BFA6;} .gold{stroke:#C98A1F;}
      .fdot{fill:#C98A1F;} .idot{fill:#26251F;}
      .lbl{fill:#8A8161;font-family:'Geist Mono','SFMono-Regular',ui-monospace,monospace;font-size:19px;letter-spacing:0.04em;}
      .glbl{fill:#6B4E12;}
      .mono{fill:#C98A1F;font-family:'Geist','Inter',system-ui,sans-serif;font-size:34px;font-weight:600;letter-spacing:-0.02em;}
      .dot{fill:#272727;}
      .term{fill:#3B382E;font-family:'Geist Mono',ui-monospace,monospace;font-size:21px;}
    </style>
  </defs>
  <rect width="1200" height="675" fill="#FCF8F0"/>
  <rect x="820" y="-220" width="600" height="600" fill="url(#de-halo)"/>
  <text x="64" y="90" class="mono">kv<tspan class="dot">.</tspan></text>

  <!-- wifi arcs -->
  <g fill="none" stroke="#C98A1F" stroke-width="2.5" stroke-linecap="round">
    <path d="M520 196 a26 26 0 0 1 44 0"/>
    <path d="M506 180 a46 46 0 0 1 72 0"/>
    <circle cx="542" cy="206" r="3.5" class="fdot" stroke="none"/>
  </g>

  <!-- SSH tunnel -->
  <g>
    <line x1="588" y1="330" x2="892" y2="330" stroke="#C98A1F" stroke-width="2.5" stroke-dasharray="6 7" stroke-linecap="round"/>
    <text x="740" y="312" text-anchor="middle" class="lbl" fill="#6B4E12">ssh · mosh</text>
  </g>

  <!-- cyberdeck device -->
  <g>
    <rect x="150" y="224" width="438" height="266" rx="24" fill="#FCF8F0" stroke="#26251F" stroke-width="3"/>
    <!-- screen (reflective monochrome) -->
    <rect x="184" y="246" width="370" height="150" rx="8" fill="#ECE6D6" stroke="#C9BFA6" stroke-width="2"/>
    <text x="204" y="290" class="term">kv@deck:~$ ssh home</text>
    <text x="204" y="322" class="term" fill="#8F8A79">connected · vt100</text>
    <rect x="204" y="338" width="15" height="22" class="fdot"/>
    <!-- keyboard (CardKB) -->
    <g fill="none" stroke="#26251F" stroke-width="1.8">
      <rect x="186" y="410" width="28" height="26" rx="5"/><rect x="222" y="410" width="28" height="26" rx="5"/><rect x="258" y="410" width="28" height="26" rx="5"/><rect x="294" y="410" width="28" height="26" rx="5"/><rect x="330" y="410" width="28" height="26" rx="5"/><rect x="366" y="410" width="28" height="26" rx="5"/><rect x="402" y="410" width="28" height="26" rx="5"/><rect x="438" y="410" width="28" height="26" rx="5"/><rect x="474" y="410" width="28" height="26" rx="5"/><rect x="510" y="410" width="28" height="26" rx="5"/>
      <rect x="204" y="444" width="28" height="26" rx="5"/><rect x="240" y="444" width="28" height="26" rx="5"/><rect x="276" y="444" width="28" height="26" rx="5"/><rect x="312" y="444" width="100" height="26" rx="5"/><rect x="420" y="444" width="28" height="26" rx="5"/><rect x="456" y="444" width="28" height="26" rx="5"/><rect x="492" y="444" width="28" height="26" rx="5"/>
    </g>
    <text x="369" y="536" text-anchor="middle" class="lbl">cyberdeck · ESP32-S3</text>
  </g>

  <!-- remote machine -->
  <g>
    <rect x="892" y="252" width="118" height="156" rx="12" fill="#FCF8F0" stroke="#26251F" stroke-width="2.5"/>
    <g stroke="#C9BFA6" stroke-width="1.8" stroke-linecap="round">
      <line x1="912" y1="286" x2="990" y2="286"/>
      <line x1="912" y1="318" x2="990" y2="318"/>
      <line x1="912" y1="350" x2="990" y2="350"/>
    </g>
    <g fill="#C98A1F"><circle cx="920" cy="286" r="4"/><circle cx="920" cy="318" r="4"/><circle cx="920" cy="350" r="4"/></g>
    <text x="951" y="446" text-anchor="middle" class="lbl">your machine</text>
  </g>
</svg>
